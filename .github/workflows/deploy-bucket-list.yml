name: Build and deploy Bucket List

on:
  pull_request:
    paths:
      - "bucket-list-app/**"
      - ".github/workflows/deploy-bucket-list.yml"
  push:
    branches:
      - main
      - claude/web-bucket-list-keumthe-liff-9k4jbupfpds
    paths:
      - "bucket-list-app/**"
      - ".github/workflows/deploy-bucket-list.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bucket-list-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bucket-list-app/package-lock.json

      - name: Install dependencies
        working-directory: bucket-list-app
        run: npm ci

      - name: Lint
        working-directory: bucket-list-app
        run: npm run lint

      - name: Build
        working-directory: bucket-list-app
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bucket-list-app
          command: deploy
