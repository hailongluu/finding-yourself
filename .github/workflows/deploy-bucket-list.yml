name: Validate Bucket List

on:
  pull_request:
    paths:
      - "bucket-list-app/**"
      - ".github/workflows/deploy-bucket-list.yml"
  push:
    branches:
      - main
    paths:
      - "bucket-list-app/**"
      - ".github/workflows/deploy-bucket-list.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bucket-list-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bucket-list-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
